function exportData(format, filteredOnly) {
  const list = filteredOnly ? App.filtered : App.bookmarks;
  if (!list.length) { toasts.warn('Nothing to export'); return; }
  const date = new Date().toISOString().slice(0, 10);
  if (format === 'json') {
    const payload = {
      app: 'Marklet', version: 1, exportedAt: new Date().toISOString(),
      count: list.length,
      categories: App.categories.map(c => ({ id: c.id, name: c.name, color: c.color })),
      bookmarks: list.map(b => ({
        id: b.id, url: b.url, normalizedUrl: b.normalizedUrl, domain: b.domain,
        title: b.title, description: b.description, favicon: b.favicon,
        category: getCat(b.categoryId).name, categoryId: b.categoryId,
        tags: b.tags, favorite: b.favorite, read: b.read, archived: b.archived,
        openCount: b.openCount || 0, lastOpenedAt: b.lastOpenedAt,
        createdAt: b.createdAt, updatedAt: b.updatedAt
      }))
    };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `marklet-${date}.json`);
  } else {
    const headers = ['id','url','title','description','domain','category','tags','favorite','read','archived','createdAt','updatedAt'];
    const rows = [headers.join(',')];
    const esc = v => {
      const s = v === null || v === undefined ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    for (const b of list) {
      rows.push([
        b.id, b.url, b.title, b.description, b.domain,
        getCat(b.categoryId).name, b.tags.join('|'),
        b.favorite ? '1' : '0', b.read ? '1' : '0', b.archived ? '1' : '0',
        b.createdAt, b.updatedAt
      ].map(esc).join(','));
    }
    downloadBlob(new Blob([rows.join('\n')], { type: 'text/csv' }), `marklet-${date}.csv`);
  }
  toasts.success(`Exported ${list.length} bookmark${list.length === 1 ? '' : 's'}`);
}

function bulkExport() {
  const list = App.bookmarks.filter(b => App.selected.has(b.id));
  if (!list.length) return;
  const payload = { app: 'Marklet', bookmarks: list };
  downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), `marklet-selected-${Date.now()}.json`);
  toasts.success(`Exported ${list.length} selected`);
}

async function handleImport(e, format) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    let items;
    if (format === 'json') items = parseJSONImport(text);
    else items = parseCSVImport(text);
    if (!items.length) { toasts.warn('No bookmarks found in file'); return; }
    await confirmImport(items);
  } catch (err) {
    toasts.error('Import failed: ' + err.message);
  }
}

function parseJSONImport(text) {
  const data = JSON.parse(text);
  const arr = Array.isArray(data) ? data : (data.bookmarks || []);
  if (!Array.isArray(arr)) throw new Error('Invalid JSON structure');
  return arr.map(normalizeImportItem).filter(Boolean);
}

function parseCSVImport(text) {
  const lines = parseCSVLines(text);
  if (lines.length < 2) throw new Error('CSV is empty');
  const headers = lines[0].map(h => h.trim().toLowerCase());
  const idx = name => headers.indexOf(name);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const row = lines[i];
    if (!row.length || !row[idx('url')]) continue;
    const get = name => { const j = idx(name); return j >= 0 ? (row[j] || '').trim() : ''; };
    out.push(normalizeImportItem({
      id: get('id'),
      url: get('url'),
      title: get('title'),
      description: get('description'),
      domain: get('domain'),
      category: get('category'),
      tags: (get('tags') || '').split('|').map(t => t.trim()).filter(Boolean),
      favorite: get('favorite') === '1' || get('favorite') === 'true',
      read: get('read') === '1' || get('read') === 'true',
      archived: get('archived') === '1' || get('archived') === 'true',
      createdAt: parseInt(get('createdat')) || Date.now(),
      updatedAt: parseInt(get('updatedat')) || Date.now()
    }));
  }
  return out.filter(Boolean);
}

function parseCSVLines(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = []; field = '';
      } else field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normalizeImportItem(raw) {
  if (!raw || !raw.url) return null;
  const url = normalizeUrl(raw.url);
  if (!url) return null;
  const title = String(raw.title || '').slice(0, 500) || domainOf(url);
  const description = String(raw.description || '').slice(0, 3000);
  const tags = Array.isArray(raw.tags)
    ? raw.tags.map(t => String(t).trim().slice(0, 40)).filter(Boolean).slice(0, 30)
    : [];
  return {
    id: raw.id && typeof raw.id === 'string' ? raw.id : uid(),
    url, normalizedUrl: url, domain: domainOf(url),
    title, description,
    favicon: typeof raw.favicon === 'string' ? raw.favicon : '',
    categoryName: typeof raw.category === 'string' ? raw.category : '',
    tags,
    favorite: !!raw.favorite, read: !!raw.read, archived: !!raw.archived,
    openCount: Number(raw.openCount) || 0,
    lastOpenedAt: raw.lastOpenedAt || null,
    createdAt: Number(raw.createdAt) || Date.now(),
    updatedAt: Number(raw.updatedAt) || Date.now()
  };
}

async function confirmImport(items) {
  // Detect duplicates
  const existingByUrl = new Map();
  for (const b of App.bookmarks) existingByUrl.set(b.normalizedUrl, b);
  const newItems = [], dupItems = [];
  const seenInBatch = new Set();
  for (const item of items) {
    if (seenInBatch.has(item.normalizedUrl) || existingByUrl.has(item.normalizedUrl)) dupItems.push(item);
    else { newItems.push(item); seenInBatch.add(item.normalizedUrl); }
  }

  return new Promise(res => {
    const dupChoice = el('select', { class: 'input' },
      el('option', { value: 'skip', text: `Skip duplicates (${dupItems.length})` }),
      el('option', { value: 'replace', text: 'Replace existing duplicates' }),
      el('option', { value: 'keep', text: 'Keep both (add anyway)' })
    );
    dupChoice.value = dupItems.length ? 'skip' : 'keep';

    const m = el('div', { class: 'modal sm' },
      el('div', { class: 'modal-head' },
        el('div', null,
          el('div', { class: 'modal-title', text: 'Import summary' }),
          el('div', { class: 'modal-sub', text: `${items.length} items found` })
        )
      ),
      el('div', { class: 'modal-body' },
        el('p', { text: `${newItems.length} new bookmark${newItems.length === 1 ? '' : 's'}`, style: { color: 'var(--ok)', marginBottom: '6px' } }),
        dupItems.length ? el('p', { text: `${dupItems.length} duplicate${dupItems.length === 1 ? '' : 's'} detected`, style: { color: 'var(--warn)', marginBottom: '14px' } }) : null,
        dupItems.length ? el('div', { class: 'field' }, el('label', { text: 'How to handle duplicates?' }), dupChoice) : null
      ),
      el('div', { class: 'modal-foot' },
        el('button', { class: 'btn', text: 'Cancel', onClick: () => { modal.close(); res(); } }),
        el('button', { class: 'btn primary', text: 'Import', onClick: async () => {
          modal.close();
          await performImport(newItems, dupItems, dupChoice.value);
          res();
        }})
      )
    );
    modal.open(m);
  });
}

async function performImport(newItems, dupItems, dupMode) {
  // Create missing categories
  const catByName = new Map(App.categories.map(c => [c.name.toLowerCase(), c]));
  const needed = new Set();
  for (const it of [...newItems, ...dupItems]) if (it.categoryName) needed.add(it.categoryName);
  for (const name of needed) {
    const key = name.toLowerCase();
    if (!catByName.has(key) && name.toLowerCase() !== 'uncategorized') {
      const cat = { id: uid(), name, color: colorFromString(name), createdAt: Date.now() };
      App.categories.push(cat);
      catByName.set(key, cat);
      await storage.put(S_CAT, cat);
    }
  }
  buildCatMap();

  const toAdd = [];
  const now = Date.now();

  const resolveCat = name => {
    if (!name) return UNCAT;
    if (name.toLowerCase() === 'uncategorized') return UNCAT;
    const c = catByName.get(name.toLowerCase());
    return c ? c.id : UNCAT;
  };

  for (const it of newItems) {
    const b = {
      id: it.id, url: it.url, normalizedUrl: it.normalizedUrl, domain: it.domain,
      title: it.title, description: it.description, favicon: it.favicon,
      categoryId: resolveCat(it.categoryName), tags: it.tags,
      favorite: it.favorite, read: it.read, archived: it.archived,
      openCount: it.openCount, lastOpenedAt: it.lastOpenedAt,
      createdAt: it.createdAt || now, updatedAt: it.updatedAt || now
    };
    b._s = makeBlob(b);
    toAdd.push(b);
  }

  if (dupMode === 'replace') {
    for (const it of dupItems) {
      const existing = App.bookmarks.find(b => b.normalizedUrl === it.normalizedUrl);
      if (existing) {
        Object.assign(existing, {
          title: it.title || existing.title,
          description: it.description || existing.description,
          categoryId: resolveCat(it.categoryName) || existing.categoryId,
          tags: it.tags.length ? it.tags : existing.tags,
          favorite: it.favorite, read: it.read, archived: it.archived,
          updatedAt: now
        });
        existing._s = makeBlob(existing);
        toAdd.push(existing);
      }
    }
  } else if (dupMode === 'keep') {
    for (const it of dupItems) {
      const b = {
        id: uid(), url: it.url, normalizedUrl: it.normalizedUrl, domain: it.domain,
        title: it.title, description: it.description, favicon: it.favicon,
        categoryId: resolveCat(it.categoryName), tags: it.tags,
        favorite: it.favorite, read: it.read, archived: it.archived,
        openCount: 0, lastOpenedAt: null,
        createdAt: it.createdAt || now, updatedAt: now
      };
      b._s = makeBlob(b);
      toAdd.push(b);
    }
  }

  if (!toAdd.length) { toasts.info('Nothing to import'); return; }

  // Merge into memory
  const existingIds = new Set(App.bookmarks.map(b => b.id));
  for (const b of toAdd) if (!existingIds.has(b.id)) App.bookmarks.push(b);

  await storage.bulkPut(S_BM, toAdd);
  toasts.success(`Imported ${toAdd.length} bookmark${toAdd.length === 1 ? '' : 's'}`);
  renderAll();
}

/* ---------- 18. Shortcuts panel ---------- */
function openShortcuts() {
  const rows = [
    ['/', 'Focus search'],
    ['Ctrl / ⌘ + K', 'Focus search'],
    ['Ctrl / ⌘ + N', 'Add bookmark'],
    ['Esc', 'Close modal / clear selection'],
    ['Ctrl / ⌘ + A', 'Select all visible'],
    ['Delete', 'Delete selected'],
    ['E', 'Edit selected (1 only)'],
    ['F', 'Toggle favorite on selected'],
    ['R', 'Toggle read on selected']
  ];
  const grid = el('div', { class: 'kbd-grid' });
  for (const [k, d] of rows) {
    grid.appendChild(el('div', { class: 'k-desc', text: d }));
    grid.appendChild(el('div', null, el('kbd', { text: k })));
  }
  const m = el('div', { class: 'modal sm' },
    el('div', { class: 'modal-head' },
      el('div', { class: 'modal-title', text: 'Keyboard shortcuts' }),
      el('button', { class: 'icon-btn', text: '✕', onClick: () => modal.close() })
    ),
    el('div', { class: 'modal-body' }, grid),
    el('div', { class: 'modal-foot' }, el('button', { class: 'btn primary', text: 'Got it', onClick: () => modal.close() }))
  );
  modal.open(m);
}

/* ---------- 19. Filter panel ---------- */
function buildFilterPanel() {
  const panel = $('#filterPanel');
  clear(panel);

  // Categories section
  panel.appendChild(el('h4', { text: 'Categories' }));
  const catChoices = el('div', { class: 'filter-choices' });
  App.categories.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
    const on = App.filters.categories.has(c.id);
    const b = el('button', { class: `fc${on ? ' on' : ''}` },
      el('span', { class: 'fc-dot', style: { background: c.color } }),
      el('span', { text: c.name })
    );
    b.onclick = () => { toggleCategoryFilter(c.id); buildFilterPanel(); };
    catChoices.appendChild(b);
  });
  panel.appendChild(el('div', { class: 'fp-section' }, catChoices));

  // Read status
  panel.appendChild(el('h4', { text: 'Status' }));
  const statusChoices = el('div', { class: 'filter-choices' });
  for (const [val, label] of [['read', 'Read'], ['unread', 'Unread']]) {
    const on = App.filters.read === val;
    const b = el('button', { class: `fc${on ? ' on' : ''}`, text: label });
    b.onclick = () => { App.filters.read = on ? null : val; renderAll(); buildFilterPanel(); };
    statusChoices.appendChild(b);
  }
  panel.appendChild(el('div', { class: 'fp-section' }, statusChoices));

  // Reset
  panel.appendChild(el('div', { style: { marginTop: '12px', display: 'flex', gap: '8px' } },
    el('button', { class: 'btn sm', text: 'Reset filters', onClick: () => { resetFilters(); buildFilterPanel(); } })
  ));

  // Update filter count badge
  const n = App.filters.categories.size + App.filters.tags.size + (App.filters.read ? 1 : 0) + (App.filters.view !== 'all' ? 1 : 0);
  $('#filterCount').textContent = n > 0 ? ' (' + n + ')' : '';
}

/* ---------- 20. Event wiring ---------- */
function wireEvents() {
  // Sidebar toggle (mobile)
  $('#menuBtn').onclick = () => { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
  $('#sidebarClose').onclick = () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); };
  $('#scrim').onclick = () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); };

  // Navigation
  $$('#nav .nav-item').forEach(btn => {
    btn.onclick = () => {
      App.filters.view = btn.dataset.view;
      renderAll();
      if (window.innerWidth <= 900) { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }
    };
  });

  // Search
  const searchInput = $('#searchInput');
  const doSearch = debounce(() => {
    App.search = searchInput.value;
    App._renderedCount = 100;
    renderAll();
  }, 150);
  searchInput.addEventListener('input', () => {
    $('#clearSearch').hidden = !searchInput.value;
    doSearch();
  });
  $('#clearSearch').onclick = () => {
    searchInput.value = ''; App.search = ''; $('#clearSearch').hidden = true;
    renderAll();
  };

  // Add button
  $('#addBtn').onclick = openAddModal;

  // Sort select
  const sortSel = $('#sortSelect');
  SORT_OPTIONS.forEach(o => sortSel.appendChild(el('option', { value: o.id, text: o.label, selected: App.settings.sort === o.id })));
  sortSel.onchange = () => { App.settings.sort = sortSel.value; saveSettings(); renderAll(); };

  // View toggle
  $$('.view-toggle button').forEach(b => {
    b.onclick = () => {
      $$('.view-toggle button').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
      App.settings.view = b.dataset.viewMode;
      saveSettings();
      renderAll();
    };
  });

  // Filter panel
  $('#filterBtn').onclick = (e) => {
    e.stopPropagation();
    const p = $('#filterPanel');
    p.classList.toggle('show');
    if (p.classList.contains('show')) buildFilterPanel();
  };
  document.addEventListener('click', e => {
    const p = $('#filterPanel');
    if (p.classList.contains('show') && !p.contains(e.target) && e.target !== $('#filterBtn') && !$('#filterBtn').contains(e.target)) {
      p.classList.remove('show');
    }
  });

  // Data button
  $('#dataBtn').onclick = openDataPanel;

  // Settings & shortcuts
  $('#settingsBtn').onclick = openSettings;
  $('#shortcutsBtn').onclick = openShortcuts;
  $('#manageCatsBtn').onclick = openCategoryManager;

  // Bulk bar
  $('#bulkBar').addEventListener('click', e => e.stopPropagation());
}

/* ---------- 21. Keyboard shortcuts ---------- */
function wireKeyboard() {
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

    // Escape
    if (e.key === 'Escape') {
      if (modal.current) { modal.close(); return; }
      if (App.selected.size) { App.selected.clear(); renderAll(); return; }
      if ($('#filterPanel').classList.contains('show')) { $('#filterPanel').classList.remove('show'); return; }
      if (document.activeElement === $('#searchInput')) { $('#searchInput').blur(); return; }
      return;
    }

    // / or Ctrl+K = search
    if ((e.key === '/' && !inField) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault();
      $('#searchInput').focus();
      $('#searchInput').select();
      return;
    }

    // Ctrl+N = add
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      openAddModal();
      return;
    }

    if (inField || modal.current) return;

    // Ctrl+A = select all visible
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      App.filtered.forEach(b => App.selected.add(b.id));
      renderAll();
      return;
    }

    // Delete
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (App.selected.size) { e.preventDefault(); bulkDelete(); }
      return;
    }

    // E = edit (single)
    if (e.key.toLowerCase() === 'e' && App.selected.size === 1) {
      openEditModal(Array.from(App.selected)[0]);
      return;
    }

    // F = favorite
    if (e.key.toLowerCase() === 'f' && App.selected.size) {
      bulkAction('fav');
      return;
    }

    // R = read
    if (e.key.toLowerCase() === 'r' && App.selected.size) {
      bulkAction('read');
      return;
    }
  });
}

/* ---------- 22. Bootstrap ---------- */
async function boot() {
  try {
    await storage.open();
  } catch (e) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#fff"><h2>Database error</h2><p>' + e.message + '</p></div>';
    return;
  }

  loadSettings();

  // Load categories
  App.categories = await storage.getAll(S_CAT);
  if (!App.categories.length) {
    const now = Date.now();
    App.categories = DEFAULT_CATEGORIES.map((c, i) => ({ id: uid(), name: c.name, color: c.color, createdAt: now + i }));
    await storage.bulkPut(S_CAT, App.categories);
  }
  buildCatMap();

  // Load bookmarks
  App.bookmarks = await storage.getAll(S_BM);
  for (const b of App.bookmarks) {
    if (!Array.isArray(b.tags)) b.tags = [];
    b._s = makeBlob(b);
  }

  // Load favicon cache
  try {
    const kv = await storage.getAll(S_KV);
    for (const row of kv) {
      if (row.key && row.key.startsWith('favicon:')) App.favicons.set(row.key.slice(8), row.value);
      if (row.key && row.key.startsWith('meta:')) App.metaCache.set(row.key.slice(5), row.value);
    }
  } catch {}

  // Ensure the settings view matches the toggle
  $$('.view-toggle button').forEach(b => b.classList.toggle('is-active', b.dataset.viewMode === App.settings.view));

  wireEvents();
  wireKeyboard();

  App._renderedCount = 100;
  renderAll();
  App._loaded = true;

  // Online/offline notifications
  window.addEventListener('online', () => toasts.info('You are back online'));
  window.addEventListener('offline', () => toasts.warn('You are offline — metadata fetching disabled'));
}

document.addEventListener('DOMContentLoaded', boot);
</script>
